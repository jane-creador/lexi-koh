{% extends 'base.html' %}
{% block title %}Nueva lista — Lexi-Koh{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <a href="{{ url_for('home.index') }}"
         class="text-muted small text-decoration-none d-inline-flex align-items-center gap-1 mb-4">
        <i class="bi bi-arrow-left"></i> Inicio
      </a>

      <div class="lk-card p-4 p-md-5">
        <h2 class="fw-bold mb-1">Nueva lista</h2>
        <p class="text-muted mb-4">
          Crea un campo semántico para organizar tu vocabulario por temas.
        </p>

        <form method="post" action="{{ url_for('lists.create_list') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold small">Nombre de la lista <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control lk-input"
                   placeholder="Ej: Verbos de cocina" required maxlength="200" autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold small">
              Descripción
              <span class="text-muted fw-normal">(opcional)</span>
            </label>
            <input type="text" name="description" class="form-control lk-input"
                   placeholder="Ej: Verbos usados en la cocina" maxlength="500">
          </div>
          <div class="d-flex gap-2">
            <a href="{{ url_for('home.index') }}"
               class="btn btn-outline-secondary flex-fill lk-btn-outline">
              Cancelar
            </a>
            <button type="submit" class="btn lk-btn-primary flex-fill">
              <i class="bi bi-check-lg me-1"></i>Crear lista
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
